<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Layout: bright gradient-fade landing -> calm drafting-table workspace (inputs left, live section + checks right).
   Palette: engineering ink on a cool sheet, with site-safety tangerine, rebar blue, link teal and a signal pink. */
:root{
  --bg:#F5F8FC; --bg2:#EDF2F9; --card:#FFFFFF; --ink:#13213A; --muted:#58698A; --line:#DDE5F0; --line2:#C9D5E6;
  --acc:#FF6A2B; --acc-ink:#FFFFFF; --blue:#2E6BFF; --teal:#00A89A; --pink:#F2387A; --sun:#FFC23D;
  --ok:#119C55; --warn:#C97A06; --bad:#D8303F; --ok-bg:#E6F6EE; --warn-bg:#FFF3DC; --bad-bg:#FDE8EA;
  --conc:#E4EAF3; --conc-line:#8C9BB5; --hero-a:#FFF1E6; --hero-b:#EAF6FF; --glass:rgba(255,255,255,.72);
  --shadow:0 1px 2px rgba(19,33,58,.06),0 8px 24px -12px rgba(19,33,58,.18);
  --paper:#FFFFFF; --paper-ink:#141B2B; --paper-mute:#5A6478; --paper-line:#D5DBE5; --paper-tint:#F3F6FA;
  --f-disp:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1320; --bg2:#101A2B; --card:#141E31; --ink:#E7EEF9; --muted:#97A7C2; --line:#223049; --line2:#2E3E5C;
  --acc:#FF7A3D; --acc-ink:#1A0E05; --blue:#6E97FF; --teal:#2ECFBE; --pink:#FF5C94; --sun:#FFCF5C;
  --ok:#3DD68C; --warn:#F2B64A; --bad:#FF6B78; --ok-bg:#0F2E22; --warn-bg:#33260B; --bad-bg:#3A1419;
  --conc:#23304A; --conc-line:#6F82A6; --hero-a:#1A1420; --hero-b:#0E1C2E; --glass:rgba(20,30,49,.72);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1320; --bg2:#101A2B; --card:#141E31; --ink:#E7EEF9; --muted:#97A7C2; --line:#223049; --line2:#2E3E5C;
  --acc:#FF7A3D; --acc-ink:#1A0E05; --blue:#6E97FF; --teal:#2ECFBE; --pink:#FF5C94; --sun:#FFCF5C;
  --ok:#3DD68C; --warn:#F2B64A; --bad:#FF6B78; --ok-bg:#0F2E22; --warn-bg:#33260B; --bad-bg:#3A1419;
  --conc:#23304A; --conc-line:#6F82A6; --hero-a:#1A1420; --hero-b:#0E1C2E; --glass:rgba(20,30,49,.72);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-disp);line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
sub,sup{font-size:.72em;line-height:0}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;font-family:var(--f-disp);font-size:20px;font-weight:600;padding:0}
.brand b{color:var(--acc)}
.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--pink));color:#fff;font-weight:700;font-size:18px}
.nav-links{display:flex;gap:4px;flex-wrap:wrap}
.nav-links button{background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav-links button:hover{color:var(--ink);background:var(--bg2)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.chip-pro{background:linear-gradient(90deg,var(--acc),var(--pink));color:#fff;border:0}
.chip-admin{background:var(--ink);color:var(--bg);border:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:11px 20px;font-weight:600;border:1px solid transparent;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:8px 14px;font-size:14px} .btn.xs{padding:4px 9px;font-size:12.5px;border-radius:7px} .btn.wide{width:100%}
.btn-hot{background:var(--acc);color:var(--acc-ink);box-shadow:0 6px 18px -8px var(--acc)}
.btn-glass{background:var(--glass);border-color:var(--line2);backdrop-filter:blur(6px)}
.btn-ghost{background:var(--card);border-color:var(--line2)}
.btn-ghost:hover:not(:disabled){border-color:var(--muted)}
.btn-lock{background:var(--bg2);border-color:var(--line2);color:var(--muted)}
.btn-danger{background:var(--bad);color:#fff}
.btn-danger-ghost{background:none;border-color:var(--bad);color:var(--bad)}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:600;padding:2px 0}
.icon-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--card);font-size:18px;line-height:1;color:var(--muted)}

/* pills */
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:2px 9px;border-radius:999px;background:var(--bg2);color:var(--muted);white-space:nowrap}
.pill.ok,.pill.st-ok{background:var(--ok-bg);color:var(--ok)} .pill.st-warn{background:var(--warn-bg);color:var(--warn)} .pill.st-bad{background:var(--bad-bg);color:var(--bad)}
.pill.free{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.pill.pro{background:linear-gradient(90deg,var(--acc),var(--pink));color:#fff}
.pill.soon{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}

/* hero with fading gradient */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));border-bottom:1px solid var(--line)}
.glow{position:absolute;inset:0;pointer-events:none}
.glow i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.glow .g1{width:520px;height:520px;background:var(--acc);left:-120px;top:-160px}
.glow .g2{width:460px;height:460px;background:var(--pink);right:8%;top:-140px;animation-delay:-5s;animation-duration:22s}
.glow .g3{width:520px;height:520px;background:var(--teal);right:-160px;bottom:-240px;animation-delay:-9s}
.glow .g4{width:380px;height:380px;background:var(--sun);left:30%;bottom:-220px;animation-delay:-3s;animation-duration:26s}
.glow.soft i{opacity:.28}
@keyframes drift{0%{transform:translate(0,0) scale(1);opacity:.35}50%{opacity:.62}100%{transform:translate(60px,40px) scale(1.15);opacity:.4}}
.hero-in{position:relative;max-width:1240px;margin:0 auto;padding:64px 20px 72px;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(34px,5.2vw,60px);font-weight:700;letter-spacing:-.01em;margin-bottom:18px}
.nw{white-space:nowrap}
.grad{background:linear-gradient(90deg,var(--acc),var(--pink) 45%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:17.5px;max-width:58ch;color:var(--ink);opacity:.86}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 34px}
.cta-row .btn{padding:14px 26px;font-size:16px}
.hero-facts{display:flex;gap:28px;flex-wrap:wrap;margin:0}
.hero-facts div{min-width:0}
.hero-facts dt{font-family:var(--f-disp);font-size:24px;font-weight:700}
.hero-facts dd{margin:0;font-size:13px;color:var(--muted);max-width:18ch}
.hero-card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--line2) 70%,transparent);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.hc-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.hc-body{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.hero-svg{width:100%;height:auto}
.hc-urs{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.hc-urs li{display:grid;grid-template-columns:1fr;gap:4px;font-size:13px}
.hc-urs li span{color:var(--muted)} .hc-urs li b{font-family:var(--f-mono);font-size:13px}
.hc-note{font-size:12.5px;color:var(--muted);margin-top:10px}
.ur{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.ur i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--blue))}

/* bands */
.band{padding-block:64px}
.band h2{font-size:clamp(24px,3vw,32px);margin-bottom:26px}
.codes-band{background:var(--card);border-bottom:1px solid var(--line)}
.code-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.code-tile{position:relative;border-radius:16px;padding:22px;border:1px solid var(--line);background:var(--bg);display:grid;gap:6px;overflow:hidden;min-width:0}
.code-tile::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--tone)}
.code-tile h3{font-size:22px} .code-tile p{color:var(--muted);font-size:14px}
.code-tile .mono{color:var(--ink);font-size:13px}
.code-tag{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--tone);justify-self:start;border:1.5px solid var(--tone);padding:1px 7px;border-radius:6px}
.tone-blue{--tone:var(--blue)} .tone-teal{--tone:var(--teal)} .tone-orange{--tone:var(--acc)}
.feat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.feat{border-radius:16px;padding:20px;background:var(--card);border:1px solid var(--line);display:grid;gap:6px;align-content:start;min-width:0;background-image:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--tone) 14%,transparent),transparent 60%)}
.feat-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.feat h3{font-size:19px} .feat-en{font-size:13px;color:var(--tone);font-weight:600} .feat p:last-child{font-size:14px;color:var(--muted)}
.feat-soon{--tone:var(--blue);border-style:dashed}
.steps-band{background:var(--bg2)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;counter-reset:st}
.steps li{counter-increment:st;display:grid;gap:4px;padding:20px 20px 20px 70px;position:relative;background:var(--card);border-radius:14px;border:1px solid var(--line)}
.steps li::before{content:counter(st);position:absolute;left:18px;top:18px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;color:#fff;background:linear-gradient(135deg,var(--acc),var(--pink))}
.steps b{font-family:var(--f-disp);font-size:17px} .steps span{font-size:14px;color:var(--muted)}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:880px}
.plan{position:relative;border:1px solid var(--line);border-radius:18px;padding:26px;background:var(--card);display:grid;gap:12px;align-content:start}
.plan h3{font-size:24px} .price{font-family:var(--f-disp);font-size:20px;font-weight:600;color:var(--muted)}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14.5px}
.plan li{padding-left:24px;position:relative}
.plan li::before{content:"";position:absolute;left:2px;top:7px;width:12px;height:7px;border-left:2.5px solid var(--ok);border-bottom:2.5px solid var(--ok);transform:rotate(-45deg)}
.plan li.no{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.plan li.no::before{border:0;width:10px;height:2px;background:var(--muted);transform:none;top:11px}
.plan .btn{justify-self:start;margin-top:6px}
.plan-pro{border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--acc),var(--pink),var(--blue)) border-box}
.ribbon{position:absolute;top:-12px;right:20px;background:var(--acc);color:var(--acc-ink);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.foot{border-top:1px solid var(--line);padding-block:22px;font-size:13px;color:var(--muted)}
.foot-in{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* auth */
.auth-wrap{position:relative;overflow:hidden;min-height:70vh;display:grid;place-items:center;padding:48px 16px;background:linear-gradient(160deg,var(--hero-a),var(--hero-b))}
.auth-card{position:relative;width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow);display:grid;gap:8px}
.auth-card h1{font-size:28px} .auth-card .muted{margin-bottom:10px}
.auth-card label{font-size:13.5px;font-weight:600;margin-top:6px}
.auth-card input{padding:11px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg)}
.auth-card .btn{margin-top:14px}
.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0}
.auth-alt{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:13.5px}
.auth-alt .btn{margin-top:0}
.reg-card{max-width:680px} .reg-card > label:not(.chkl){display:grid;gap:4px;font-size:13.5px;font-weight:600}
.reg-card .mgrid label,.contact-card label{display:grid;gap:4px;font-size:13.5px;font-weight:600}
.reg-card .mgrid input,.reg-card select,.reg-card > label input,.contact-card input,.contact-card textarea,.account input,.account select,.account textarea,.payinfo-card textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:inherit;font-weight:400}
.plan-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.plan-pick button{display:grid;gap:2px;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line2);background:var(--bg);cursor:pointer;color:var(--ink)}
.plan-pick button b{font-size:17px} .plan-pick button span{font-family:var(--f-mono);font-weight:600} .plan-pick button small{color:var(--muted)}
.plan-pick button[aria-checked=true]{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent);background:color-mix(in srgb,var(--acc) 6%,var(--card))}
.pro-box{display:grid;gap:12px;padding:16px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--acc) 50%,var(--line2));background:color-mix(in srgb,var(--acc) 4%,var(--card));margin:6px 0}
.pro-price{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .pro-price b{font:700 22px var(--f-mono)} .pro-price .seg{margin-left:auto}
.seg.sm button{padding:4px 10px;font-size:12px}
.pro-total{display:grid;gap:2px;align-content:end;font-size:13px;color:var(--muted)} .pro-total b{font:700 20px var(--f-mono);color:var(--ink)}
.pay-info{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)} .pay-info p{margin:4px 0 0}
.file-l{display:grid;gap:6px;font-size:13.5px;font-weight:600} .file-l input{font-weight:400}
.notice{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin:0 0 14px;font-size:14px}
.notice.ok{border-color:color-mix(in srgb,var(--ok,#1a9b5b) 45%,transparent);background:color-mix(in srgb,var(--ok,#1a9b5b) 9%,var(--card))}
.notice.warn{border-color:color-mix(in srgb,#e3a008 55%,transparent);background:color-mix(in srgb,#e3a008 10%,var(--card))}
.notice.bad{border-color:color-mix(in srgb,var(--pink) 50%,transparent);background:color-mix(in srgb,var(--pink) 8%,var(--card))}
.acc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.account .card{display:grid;gap:12px} .account form{display:grid;gap:10px} .account h3{font-size:15px;margin:6px 0 0}
.account .mgrid label{display:grid;gap:4px;font-size:13.5px;font-weight:600}
.plan-now{display:flex;align-items:center;gap:10px} .plan-now b{font-size:20px}
.plan-card.is-pro{border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 7%,var(--card)),var(--card))}
.remain{display:flex;align-items:baseline;gap:10px} .remain b{font-size:46px;line-height:1;background:linear-gradient(90deg,#ff7a2b,#f2387a,#3a6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ur.big{height:10px}
.chk.mini td{padding:6px 8px;font-size:13px}
.payinfo-card{margin-bottom:14px} .payinfo-card summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap} .payinfo-card[open] summary{margin-bottom:12px}
.payinfo-card .mgrid label{display:grid;gap:4px;font-size:13px;font-weight:600}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--pink);color:#fff;font:700 11px var(--f-mono);margin-left:4px}
.mail-state{font-size:12.5px;color:var(--muted);margin:2px 0 12px;padding-left:18px;position:relative} .mail-state::before{content:'';position:absolute;left:2px;top:6px;width:8px;height:8px;border-radius:50%;background:#e3a008} .mail-state.ok::before{background:#1a9b5b}
.rq-open{background:color-mix(in srgb,#e3a008 7%,transparent)}
.days-in{display:inline-flex;align-items:center;gap:4px;font-size:12px;margin-right:4px} .days-in input{width:62px;padding:4px 6px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink)}
.msg-list{display:grid;gap:10px} .msg{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.msg.new{border-color:color-mix(in srgb,var(--pink) 45%,var(--line));box-shadow:inset 3px 0 0 var(--pink)}
.msg header{display:flex;flex-wrap:wrap;gap:8px;align-items:center} .msg p{margin:0;white-space:pre-wrap} .msg footer{font-size:13px} .linkbtn.danger{color:var(--pink)}
.contact-band{background:linear-gradient(170deg,var(--bg),color-mix(in srgb,var(--blue) 5%,var(--bg)))}
.contact-in{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:start}
.contact-pts{margin:14px 0 0;padding-left:18px;color:var(--muted);display:grid;gap:6px}
.contact-card{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.contact-card textarea{resize:vertical;min-height:110px}
@media (max-width:820px){.acc-grid,.contact-in,.plan-pick{grid-template-columns:1fr}}
.form-err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:14px}

/* pages */
.page{padding-block:28px 64px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-head h1{font-size:clamp(26px,3.4vw,36px)}
.crumbs{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:16px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;color:var(--blue);font-weight:500}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.split-card{border-radius:20px;padding:26px;display:grid;gap:18px;align-content:start;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden}
.split-card.capacity{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--acc),var(--pink)) border-box;border:2px solid transparent}
.split-card.analysis{background-image:repeating-linear-gradient(0deg,transparent 0 23px,var(--line) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,var(--line) 23px 24px);background-color:var(--card)}
.sc-head{display:flex;gap:14px;align-items:center}
.sc-head h2{font-size:24px} .sc-head p{color:var(--muted);font-size:14px}
.sc-num{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--pink))}
.analysis .sc-num{background:linear-gradient(135deg,var(--blue),var(--teal))}
.sc-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.sc-list li{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.split-card .btn{justify-self:start}
.pick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.pick{text-align:left;display:grid;gap:8px;align-content:start;padding:24px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s,border-color .15s;min-width:0}
.pick:hover{transform:translateY(-3px);border-color:var(--tone,var(--acc))}
.pick::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--tone,var(--acc));opacity:.12}
.pick-t{font-family:var(--f-disp);font-size:24px;font-weight:600}
.pick-s{font-size:14px;color:var(--muted)}
.pick-go{margin-top:8px;font-weight:600;color:var(--tone,var(--acc));font-size:14px}
.pick.elem{--tone:var(--acc)}
.pick.locked{opacity:.8} .pick.locked .pick-go{color:var(--muted)}
.ei{width:120px;height:72px;overflow:visible}
.ei .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.ei .ln-thin{fill:none;stroke:var(--muted);stroke-width:1}
.ei .ln-dash{fill:none;stroke:var(--blue);stroke-width:1.3;stroke-dasharray:4 3}
.ei .ln-dim{fill:none;stroke:var(--muted);stroke-width:.9}
.ei .ln-acc,.ei .ln-acc path{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ei .ln-txt{fill:var(--muted);font:500 9px var(--f-mono);text-anchor:middle}
.ei .dot{fill:var(--blue)}

/* design workspace */
.dz-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:14px;border-bottom:3px solid var(--tone)}
.dz-head h1{font-size:clamp(24px,3vw,32px)}
.dz-actions{display:flex;gap:8px;flex-wrap:wrap}
.note{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13.5px;color:var(--muted);margin-bottom:14px}
.note.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.dz{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px;align-items:start}
.dz-in{background:var(--card);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto}
.grp{border-bottom:1px solid var(--line)}
.grp summary{cursor:pointer;padding:8px 14px;font-family:var(--f-disp);font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between}
.grp summary::after{content:"–";color:var(--muted)} .grp:not([open]) summary::after{content:"+"}
.grp-b{padding:0 14px 10px;display:grid;gap:4px}
.fld{display:grid;grid-template-columns:1fr 140px;gap:8px;align-items:center;min-height:30px}
.fld label{font-size:13px;color:var(--muted);line-height:1.25}
.ctl{display:flex;align-items:center;border:1px solid var(--line2);border-radius:8px;background:var(--bg);overflow:hidden}
.ctl input,.ctl select{flex:1;min-width:0;border:0;background:transparent;padding:4px 8px;font-family:var(--f-mono);font-size:14px;text-align:right}
.ctl select{text-align:left}
.ctl:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent)}
.unit{font-size:12px;color:var(--muted);padding:0 9px 0 2px;white-space:nowrap}
.sub-h{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.rows{display:grid;gap:4px}
.brow{display:grid;grid-template-columns:56px 64px 14px 1fr 30px;gap:6px;align-items:center}
.brow input,.brow select{border:1px solid var(--line2);border-radius:8px;background:var(--bg);padding:4px 7px;font-family:var(--f-mono);font-size:14px;min-width:0}
.rlab{font-size:12.5px;color:var(--muted)} .x{color:var(--muted);text-align:center}
.rows .linkbtn{justify-self:start;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted)}
.dz-out{display:grid;gap:18px;min-width:0}
.out-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.card,.sketch-card,.sum-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card-h{font-size:15px;font-weight:600;margin-bottom:10px}
.sec-svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.legend{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%}
.legend i.s-bt{background:var(--blue)} .legend i.s-bb{background:var(--acc)} .legend i.s-bs{background:var(--pink)}
.legend i.s-link-k{border-radius:3px;border:2px solid var(--teal)} .legend i.s-pile-k{border:2px solid var(--muted)}
.legend i.s-perim-k{border-radius:2px;border:1.5px dashed var(--pink)} .legend i.s-strut-k{height:3px;border-radius:2px;background:var(--acc)} .legend i.s-mesh-k{height:3px;border-radius:0;background:var(--blue)}
/* svg drawing tokens */
.s-conc{fill:var(--conc);stroke:var(--conc-line);stroke-width:1.5}
.s-link{fill:none;stroke:var(--teal)} .s-link2{fill:none;stroke:color-mix(in srgb,var(--teal) 70%,var(--ink))}
.hero-svg .s-link{stroke-width:4} .hero-svg .s-link2{stroke-width:2.5}
.s-bt{fill:var(--blue)} .s-bb{fill:var(--acc)} .s-bs{fill:var(--pink)}
.s-na{stroke:var(--pink);stroke-width:1.5;stroke-dasharray:6 4}
.s-dim{stroke:var(--muted);stroke-width:1}
.s-lbl{fill:var(--muted);font:500 11.5px var(--f-mono)}
.s-mesh{stroke:var(--blue);stroke-width:1;opacity:.45}
.s-perim{fill:none;stroke:var(--pink);stroke-width:1.5;stroke-dasharray:6 4} .s-perim.thin{stroke-width:1.2}
.s-strut{stroke:var(--acc);stroke-width:2.5;opacity:.8;stroke-linecap:round}
.s-pile{fill:var(--card);stroke:var(--muted);stroke-width:1.5} .s-pile.hot{stroke:var(--acc);stroke-width:2.5}
.s-pid{fill:var(--ink);font:600 10.5px var(--f-mono)} .s-pv{fill:var(--acc);font:600 10.5px var(--f-mono)}
.s-col{fill:color-mix(in srgb,var(--ink) 75%,transparent);stroke:var(--ink)}
.s-pilee{fill:var(--bg2);stroke:var(--muted)} .s-tie{stroke:var(--blue);stroke-width:3}
/* summary */
.sum{border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:baseline}
.sum.ok{background:var(--ok-bg)} .sum.bad{background:var(--bad-bg)}
.sum-l{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);grid-column:1/-1}
.sum-v{font-family:var(--f-disp);font-size:30px;font-weight:700}
.sum.ok .sum-v{color:var(--ok)} .sum.bad .sum-v{color:var(--bad)}
.sum-u{font-size:15px} .sum-g{grid-column:1/-1;font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin:14px 0 0}
.kv div{border-top:1px solid var(--line);padding-top:6px;min-width:0}
.kv dt{font-size:12.5px;color:var(--muted)} .kv dd{margin:0;font-size:16px;font-weight:500}
.u{font-size:12px;color:var(--muted);font-family:var(--f-body)}
/* checks table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.chk th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);font-weight:600}
.chk td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.chk tr.bad td:first-child{box-shadow:inset 3px 0 var(--bad)} .chk tr.warn td:first-child{box-shadow:inset 3px 0 var(--warn)}
.num{text-align:right;white-space:nowrap}
.urb{display:grid;grid-template-columns:minmax(60px,1fr) 42px;gap:8px;align-items:center;min-width:120px}
.urb b{font-size:13px;text-align:right}
tr.ok .ur i{background:var(--ok)} tr.warn .ur i{background:var(--warn)} tr.bad .ur i{background:var(--bad)}
/* charts */
.charts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.chart{margin:0} .chart svg{width:100%;height:auto;display:block}
.chart figcaption,.figcap{font-size:13px;font-weight:600;margin-bottom:4px}
.c-grid{stroke:var(--line);stroke-width:1} .c-axis{stroke:var(--muted);stroke-width:1.2}
.c-tick{fill:var(--muted);font:10.5px var(--f-mono)} .c-ax{fill:var(--muted);font:500 11px var(--f-mono)}
.c-area{fill:color-mix(in srgb,var(--blue) 12%,transparent);stroke:none} .c-line{fill:none;stroke:var(--blue);stroke-width:2.2;stroke-linejoin:round}
.c-pt{fill:var(--acc);stroke:var(--card);stroke-width:2} .c-ptl{fill:var(--acc);font:700 11px var(--f-mono)} .c-vec{stroke:var(--acc);stroke-width:1.6;stroke-dasharray:4 3}
.elev{width:100%;min-width:420px;height:auto}

/* report (paper look, fixed in both themes) */
.rp-bar{margin-top:30px;display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;padding:16px 18px}
.rp-bar h2{font-size:20px}
.rp-meta{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.rp-meta label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.rp-meta input{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;background:var(--bg);min-width:0}
.rp-btns{display:flex;gap:8px}
.report{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-top:0;padding:34px 40px;font-size:13px;line-height:1.5;color-scheme:light}
.report .muted,.report .u{color:var(--paper-mute)}
.rp-head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;border-bottom:2px solid var(--paper-ink);padding-bottom:12px}
.rp-brand{display:flex;gap:10px;align-items:center} .rp-brand b{font-family:var(--f-disp);font-size:18px;display:block} .rp-brand small{color:var(--paper-mute);font-family:var(--f-mono);font-size:11px}
.rp-hd th,.rp-hd td{border:1px solid var(--paper-line);padding:4px 8px;font-size:12px;text-align:left}
.rp-hd th{background:var(--paper-tint);font-weight:600;width:16%;color:var(--paper-mute)}
.rp-verdict{margin:16px 0;padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;gap:10px;font-size:14px;border:1.5px solid}
.rp-verdict.ok{border-color:#119C55;color:#0C7A42;background:#EEF9F3} .rp-verdict.bad{border-color:#D8303F;color:#B3202E;background:#FDF0F1}
.rp-sec{margin-top:20px;break-inside:auto}
.rp-sec h3{font-size:15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--paper-line);padding-bottom:5px;margin-bottom:6px}
.rp-n{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:6px;background:var(--paper-ink);color:var(--paper);font-size:12px;font-family:var(--f-mono)}
.rp-cl{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--paper-mute);font-weight:400}
.rp-t td{padding:4px 6px;border-bottom:1px dotted var(--paper-line);vertical-align:top}
.rp-l{width:22%;color:var(--paper-mute)} .rp-ex{font-family:var(--f-mono);font-size:12.2px} .rp-note{width:12%;font-family:var(--f-mono);font-size:11px;color:var(--paper-mute);text-align:right}
.rp-t .num{width:18%}
.rp-txt{color:var(--paper-mute);font-style:italic;font-size:12.5px;padding:6px 0}
.rp-chk td{background:var(--paper-tint);font-weight:600}
.rp-chk.ok .rp-v{color:#0C7A42} .rp-chk.bad .rp-v{color:#B3202E}
.rp-2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.rp-in td{padding:3px 6px;border-bottom:1px dotted var(--paper-line);font-size:12px}
.rp-fig .legend{color:var(--paper-mute)}
.rp-sum th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:5px 6px;border-bottom:1.5px solid var(--paper-ink);color:var(--paper-mute)}
.rp-sum td{padding:5px 6px;border-bottom:1px solid var(--paper-line)}
.rp-foot{margin-top:22px;font-size:11px;color:var(--paper-mute);border-top:1px solid var(--paper-line);padding-top:8px}
.report .charts3{margin-top:14px}
.report{--conc:#E4EAF3;--conc-line:#8C9BB5;--muted:#5A6478;--ink:#141B2B;--line:#D5DBE5;--card:#FFFFFF;--bg2:#EDF2F9;--blue:#2E6BFF;--teal:#00A89A;--acc:#FF6A2B;--pink:#F2387A}
.pdf-mode .report{width:780px;border:0;padding:0 6px}

/* admin */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid}
.stat span{font-size:13px;color:var(--muted)} .stat b{font-family:var(--f-disp);font-size:28px;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--warn)}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:9px 16px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.tbl-tools{margin-bottom:10px} .tbl-tools input{width:100%;max-width:360px;padding:8px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--bg)}
.adm td.act{white-space:nowrap;text-align:right} .adm td.act .btn{margin-left:4px}
.empty{text-align:center;padding:36px 16px;display:grid;gap:8px;justify-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:17px;font-family:var(--f-disp)} .empty p{max-width:52ch}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(12,19,32,.5);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:640px;display:grid;gap:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.modal h2{font-size:22px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mgrid label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.mgrid input,.mgrid select{padding:8px 10px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);min-width:0}
.mgrid input:disabled{opacity:.6}
.mgrid .full,.quick,.chkl{grid-column:1/-1}
.quick{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pw{display:flex;gap:6px} .pw input{flex:1;font-family:var(--f-mono)}
.chkl{display:flex !important;align-items:center;gap:8px;color:var(--ink)}
.mfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .grow{flex:1}
.confirm{font-size:13.5px;color:var(--bad);display:flex;gap:6px;align-items:center}

/* language toggle, admin test bar, filters */
.lang{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.testbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--blue) 8%,var(--card));border:1px dashed color-mix(in srgb,var(--blue) 45%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:13.5px;color:var(--muted)}
.tbl-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pad{padding:18px 4px}

/* StructCap brand, landing hero, two-step picker */
.logo{flex:none;display:block}
.wordmark{font-family:var(--f-disp);font-weight:700;letter-spacing:-.01em}
.wordmark b{background:linear-gradient(90deg,var(--acc),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.mega{display:flex;align-items:center;gap:clamp(8px,1.2vw,14px);margin-bottom:6px}
.mega-logo{width:clamp(36px,4.5vw,56px);height:auto;filter:drop-shadow(0 12px 24px color-mix(in srgb,var(--pink) 35%,transparent))}
.mega-word{font-size:clamp(30px,4.75vw,62px);font-weight:700;letter-spacing:-.02em;line-height:1.25;padding-right:.12em;background:linear-gradient(95deg,var(--acc) 0%,var(--pink) 38%,#8B5CF6 64%,var(--blue) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.14em;overflow:visible}
.mega-word span{font-style:italic}
.tagline{font-family:var(--f-disp);font-size:clamp(20px,2.4vw,28px);font-weight:600;margin:6px 0 14px;letter-spacing:.01em}
.code-list{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:10px}
.code-list li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--glass);border:1px solid color-mix(in srgb,var(--line2) 60%,transparent);border-left:4px solid var(--tone);border-radius:12px;padding:10px 14px;backdrop-filter:blur(8px)}
.code-list b{font-family:var(--f-disp);font-size:16px} .code-list .mono{font-size:12.5px;color:var(--muted)}
.code-list p{font-size:13.5px;color:var(--muted);margin-top:2px}
.price b{font-size:30px;color:var(--ink);font-family:var(--f-disp)}
.flow{display:grid;gap:16px}
.step-h{display:flex;align-items:center;gap:12px;font-size:20px;flex-wrap:wrap}
.step-n{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--pink));color:#fff;font-size:16px}
.step-sub{font-family:var(--f-body);font-size:14px;font-weight:400}
.step2{display:grid;gap:16px;margin-top:14px;padding-top:22px;border-top:1px dashed var(--line2);scroll-margin-top:90px;animation:rise .35s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.step-wait{padding:6px 2px}
.code-row{display:flex;justify-content:space-between;align-items:center}
.code-pick.on{border:2px solid var(--tone);box-shadow:0 0 0 4px color-mix(in srgb,var(--tone) 16%,transparent),var(--shadow)}
.pick .pick-t .pill{vertical-align:middle;margin-left:6px}
.analysis-strip{margin-top:34px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:18px 22px;border:1px dashed var(--line2);border-radius:18px;background-image:repeating-linear-gradient(0deg,transparent 0 23px,var(--line) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,var(--line) 23px 24px);background-color:var(--card)}
.analysis-strip h2{font-size:20px}
@media (max-width:640px){.analysis-strip{grid-template-columns:1fr}}

/* Pro-for-free, code picker popup */

.brand{display:flex;align-items:center;gap:9px;background:none;border:0;font-family:var(--f-disp);font-size:20px;font-weight:600;padding:0}
.brand b{color:var(--acc)}
.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--pink));color:#fff;font-weight:700;font-size:18px}
.nav-links{display:flex;gap:4px;flex-wrap:wrap}
.nav-links button{background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav-links button:hover{color:var(--ink);background:var(--bg2)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.chip-pro{background:linear-gradient(90deg,var(--acc),var(--pink));color:#fff;border:0}
.chip-admin{background:var(--ink);color:var(--bg);border:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:11px 20px;font-weight:600;border:1px solid transparent;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:8px 14px;font-size:14px} .btn.xs{padding:4px 9px;font-size:12.5px;border-radius:7px} .btn.wide{width:100%}
.btn-hot{background:var(--acc);color:var(--acc-ink);box-shadow:0 6px 18px -8px var(--acc)}
.btn-glass{background:var(--glass);border-color:var(--line2);backdrop-filter:blur(6px)}
.btn-ghost{background:var(--card);border-color:var(--line2)}
.btn-ghost:hover:not(:disabled){border-color:var(--muted)}
.btn-lock{background:var(--bg2);border-color:var(--line2);color:var(--muted)}
.btn-danger{background:var(--bad);color:#fff}
.btn-danger-ghost{background:none;border-color:var(--bad);color:var(--bad)}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:600;padding:2px 0}
.icon-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--card);font-size:18px;line-height:1;color:var(--muted)}

/* pills */
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:2px 9px;border-radius:999px;background:var(--bg2);color:var(--muted);white-space:nowrap}
.pill.ok,.pill.st-ok{background:var(--ok-bg);color:var(--ok)} .pill.st-warn{background:var(--warn-bg);color:var(--warn)} .pill.st-bad{background:var(--bad-bg);color:var(--bad)}
.pill.free{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.pill.pro{background:linear-gradient(90deg,var(--acc),var(--pink));color:#fff}
.pill.soon{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}

/* hero with fading gradient */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));border-bottom:1px solid var(--line)}
.glow{position:absolute;inset:0;pointer-events:none}
.glow i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.glow .g1{width:520px;height:520px;background:var(--acc);left:-120px;top:-160px}
.glow .g2{width:460px;height:460px;background:var(--pink);right:8%;top:-140px;animation-delay:-5s;animation-duration:22s}
.glow .g3{width:520px;height:520px;background:var(--teal);right:-160px;bottom:-240px;animation-delay:-9s}
.glow .g4{width:380px;height:380px;background:var(--sun);left:30%;bottom:-220px;animation-delay:-3s;animation-duration:26s}
.glow.soft i{opacity:.28}
@keyframes drift{0%{transform:translate(0,0) scale(1);opacity:.35}50%{opacity:.62}100%{transform:translate(60px,40px) scale(1.15);opacity:.4}}
.hero-in{position:relative;max-width:1240px;margin:0 auto;padding:64px 20px 72px;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(34px,5.2vw,60px);font-weight:700;letter-spacing:-.01em;margin-bottom:18px}
.nw{white-space:nowrap}
.grad{background:linear-gradient(90deg,var(--acc),var(--pink) 45%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:17.5px;max-width:58ch;color:var(--ink);opacity:.86}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 34px}
.cta-row .btn{padding:14px 26px;font-size:16px}
.hero-facts{display:flex;gap:28px;flex-wrap:wrap;margin:0}
.hero-facts div{min-width:0}
.hero-facts dt{font-family:var(--f-disp);font-size:24px;font-weight:700}
.hero-facts dd{margin:0;font-size:13px;color:var(--muted);max-width:18ch}
.hero-card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--line2) 70%,transparent);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.hc-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.hc-body{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.hero-svg{width:100%;height:auto}
.hc-urs{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.hc-urs li{display:grid;grid-template-columns:1fr;gap:4px;font-size:13px}
.hc-urs li span{color:var(--muted)} .hc-urs li b{font-family:var(--f-mono);font-size:13px}
.hc-note{font-size:12.5px;color:var(--muted);margin-top:10px}
.ur{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.ur i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--blue))}

/* bands */
.band{padding-block:64px}
.band h2{font-size:clamp(24px,3vw,32px);margin-bottom:26px}
.codes-band{background:var(--card);border-bottom:1px solid var(--line)}
.code-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.code-tile{position:relative;border-radius:16px;padding:22px;border:1px solid var(--line);background:var(--bg);display:grid;gap:6px;overflow:hidden;min-width:0}
.code-tile::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--tone)}
.code-tile h3{font-size:22px} .code-tile p{color:var(--muted);font-size:14px}
.code-tile .mono{color:var(--ink);font-size:13px}
.code-tag{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--tone);justify-self:start;border:1.5px solid var(--tone);padding:1px 7px;border-radius:6px}
.tone-blue{--tone:var(--blue)} .tone-teal{--tone:var(--teal)} .tone-orange{--tone:var(--acc)}
.feat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.feat{border-radius:16px;padding:20px;background:var(--card);border:1px solid var(--line);display:grid;gap:6px;align-content:start;min-width:0;background-image:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--tone) 14%,transparent),transparent 60%)}
.feat-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.feat h3{font-size:19px} .feat-en{font-size:13px;color:var(--tone);font-weight:600} .feat p:last-child{font-size:14px;color:var(--muted)}
.feat-soon{--tone:var(--blue);border-style:dashed}
.steps-band{background:var(--bg2)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;counter-reset:st}
.steps li{counter-increment:st;display:grid;gap:4px;padding:20px 20px 20px 70px;position:relative;background:var(--card);border-radius:14px;border:1px solid var(--line)}
.steps li::before{content:counter(st);position:absolute;left:18px;top:18px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;color:#fff;background:linear-gradient(135deg,var(--acc),var(--pink))}
.steps b{font-family:var(--f-disp);font-size:17px} .steps span{font-size:14px;color:var(--muted)}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:880px}
.plan{position:relative;border:1px solid var(--line);border-radius:18px;padding:26px;background:var(--card);display:grid;gap:12px;align-content:start}
.plan h3{font-size:24px} .price{font-family:var(--f-disp);font-size:20px;font-weight:600;color:var(--muted)}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14.5px}
.plan li{padding-left:24px;position:relative}
.plan li::before{content:"";position:absolute;left:2px;top:7px;width:12px;height:7px;border-left:2.5px solid var(--ok);border-bottom:2.5px solid var(--ok);transform:rotate(-45deg)}
.plan li.no{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.plan li.no::before{border:0;width:10px;height:2px;background:var(--muted);transform:none;top:11px}
.plan .btn{justify-self:start;margin-top:6px}
.plan-pro{border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--acc),var(--pink),var(--blue)) border-box}
.ribbon{position:absolute;top:-12px;right:20px;background:var(--acc);color:var(--acc-ink);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.foot{border-top:1px solid var(--line);padding-block:22px;font-size:13px;color:var(--muted)}
.foot-in{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* auth */
.auth-wrap{position:relative;overflow:hidden;min-height:70vh;display:grid;place-items:center;padding:48px 16px;background:linear-gradient(160deg,var(--hero-a),var(--hero-b))}
.auth-card{position:relative;width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow);display:grid;gap:8px}
.auth-card h1{font-size:28px} .auth-card .muted{margin-bottom:10px}
.auth-card label{font-size:13.5px;font-weight:600;margin-top:6px}
.auth-card input{padding:11px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg)}
.auth-card .btn{margin-top:14px}
.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0}
.auth-alt{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:13.5px}
.auth-alt .btn{margin-top:0}
.reg-card{max-width:680px} .reg-card > label:not(.chkl){display:grid;gap:4px;font-size:13.5px;font-weight:600}
.reg-card .mgrid label,.contact-card label{display:grid;gap:4px;font-size:13.5px;font-weight:600}
.reg-card .mgrid input,.reg-card select,.reg-card > label input,.contact-card input,.contact-card textarea,.account input,.account select,.account textarea,.payinfo-card textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:inherit;font-weight:400}
.plan-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.plan-pick button{display:grid;gap:2px;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line2);background:var(--bg);cursor:pointer;color:var(--ink)}
.plan-pick button b{font-size:17px} .plan-pick button span{font-family:var(--f-mono);font-weight:600} .plan-pick button small{color:var(--muted)}
.plan-pick button[aria-checked=true]{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent);background:color-mix(in srgb,var(--acc) 6%,var(--card))}
.pro-box{display:grid;gap:12px;padding:16px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--acc) 50%,var(--line2));background:color-mix(in srgb,var(--acc) 4%,var(--card));margin:6px 0}
.pro-price{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .pro-price b{font:700 22px var(--f-mono)} .pro-price .seg{margin-left:auto}
.seg.sm button{padding:4px 10px;font-size:12px}
.pro-total{display:grid;gap:2px;align-content:end;font-size:13px;color:var(--muted)} .pro-total b{font:700 20px var(--f-mono);color:var(--ink)}
.pay-info{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)} .pay-info p{margin:4px 0 0}
.file-l{display:grid;gap:6px;font-size:13.5px;font-weight:600} .file-l input{font-weight:400}
.notice{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin:0 0 14px;font-size:14px}
.notice.ok{border-color:color-mix(in srgb,var(--ok,#1a9b5b) 45%,transparent);background:color-mix(in srgb,var(--ok,#1a9b5b) 9%,var(--card))}
.notice.warn{border-color:color-mix(in srgb,#e3a008 55%,transparent);background:color-mix(in srgb,#e3a008 10%,var(--card))}
.notice.bad{border-color:color-mix(in srgb,var(--pink) 50%,transparent);background:color-mix(in srgb,var(--pink) 8%,var(--card))}
.acc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.account .card{display:grid;gap:12px} .account form{display:grid;gap:10px} .account h3{font-size:15px;margin:6px 0 0}
.account .mgrid label{display:grid;gap:4px;font-size:13.5px;font-weight:600}
.plan-now{display:flex;align-items:center;gap:10px} .plan-now b{font-size:20px}
.plan-card.is-pro{border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 7%,var(--card)),var(--card))}
.remain{display:flex;align-items:baseline;gap:10px} .remain b{font-size:46px;line-height:1;background:linear-gradient(90deg,#ff7a2b,#f2387a,#3a6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ur.big{height:10px}
.chk.mini td{padding:6px 8px;font-size:13px}
.payinfo-card{margin-bottom:14px} .payinfo-card summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap} .payinfo-card[open] summary{margin-bottom:12px}
.payinfo-card .mgrid label{display:grid;gap:4px;font-size:13px;font-weight:600}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--pink);color:#fff;font:700 11px var(--f-mono);margin-left:4px}
.mail-state{font-size:12.5px;color:var(--muted);margin:2px 0 12px;padding-left:18px;position:relative} .mail-state::before{content:'';position:absolute;left:2px;top:6px;width:8px;height:8px;border-radius:50%;background:#e3a008} .mail-state.ok::before{background:#1a9b5b}
.rq-open{background:color-mix(in srgb,#e3a008 7%,transparent)}
.days-in{display:inline-flex;align-items:center;gap:4px;font-size:12px;margin-right:4px} .days-in input{width:62px;padding:4px 6px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink)}
.msg-list{display:grid;gap:10px} .msg{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.msg.new{border-color:color-mix(in srgb,var(--pink) 45%,var(--line));box-shadow:inset 3px 0 0 var(--pink)}
.msg header{display:flex;flex-wrap:wrap;gap:8px;align-items:center} .msg p{margin:0;white-space:pre-wrap} .msg footer{font-size:13px} .linkbtn.danger{color:var(--pink)}
.contact-band{background:linear-gradient(170deg,var(--bg),color-mix(in srgb,var(--blue) 5%,var(--bg)))}
.contact-in{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:start}
.contact-pts{margin:14px 0 0;padding-left:18px;color:var(--muted);display:grid;gap:6px}
.contact-card{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.contact-card textarea{resize:vertical;min-height:110px}
@media (max-width:820px){.acc-grid,.contact-in,.plan-pick{grid-template-columns:1fr}}
.form-err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:14px}

/* pages */
.page{padding-block:28px 64px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-head h1{font-size:clamp(26px,3.4vw,36px)}
.crumbs{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:16px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;color:var(--blue);font-weight:500}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.split-card{border-radius:20px;padding:26px;display:grid;gap:18px;align-content:start;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden}
.split-card.capacity{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--acc),var(--pink)) border-box;border:2px solid transparent}
.split-card.analysis{background-image:repeating-linear-gradient(0deg,transparent 0 23px,var(--line) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,var(--line) 23px 24px);background-color:var(--card)}
.sc-head{display:flex;gap:14px;align-items:center}
.sc-head h2{font-size:24px} .sc-head p{color:var(--muted);font-size:14px}
.sc-num{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--pink))}
.analysis .sc-num{background:linear-gradient(135deg,var(--blue),var(--teal))}
.sc-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.sc-list li{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.split-card .btn{justify-self:start}
.pick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.pick{text-align:left;display:grid;gap:8px;align-content:start;padding:24px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s,border-color .15s;min-width:0}
.pick:hover{transform:translateY(-3px);border-color:var(--tone,var(--acc))}
.pick::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--tone,var(--acc));opacity:.12}
.pick-t{font-family:var(--f-disp);font-size:24px;font-weight:600}
.pick-s{font-size:14px;color:var(--muted)}
.pick-go{margin-top:8px;font-weight:600;color:var(--tone,var(--acc));font-size:14px}
.pick.elem{--tone:var(--acc)}
.pick.locked{opacity:.8} .pick.locked .pick-go{color:var(--muted)}
.ei{width:120px;height:72px;overflow:visible}
.ei .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.ei .ln-thin{fill:none;stroke:var(--muted);stroke-width:1}
.ei .ln-dash{fill:none;stroke:var(--blue);stroke-width:1.3;stroke-dasharray:4 3}
.ei .ln-dim{fill:none;stroke:var(--muted);stroke-width:.9}
.ei .ln-acc,.ei .ln-acc path{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ei .ln-txt{fill:var(--muted);font:500 9px var(--f-mono);text-anchor:middle}
.ei .dot{fill:var(--blue)}

/* design workspace */
.dz-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:14px;border-bottom:3px solid var(--tone)}
.dz-head h1{font-size:clamp(24px,3vw,32px)}
.dz-actions{display:flex;gap:8px;flex-wrap:wrap}
.note{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13.5px;color:var(--muted);margin-bottom:14px}
.note.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.dz{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px;align-items:start}
.dz-in{background:var(--card);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto}
.grp{border-bottom:1px solid var(--line)}
.grp summary{cursor:pointer;padding:8px 14px;font-family:var(--f-disp);font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between}
.grp summary::after{content:"–";color:var(--muted)} .grp:not([open]) summary::after{content:"+"}
.grp-b{padding:0 14px 10px;display:grid;gap:4px}
.fld{display:grid;grid-template-columns:1fr 140px;gap:8px;align-items:center;min-height:30px}
.fld label{font-size:13px;color:var(--muted);line-height:1.25}
.ctl{display:flex;align-items:center;border:1px solid var(--line2);border-radius:8px;background:var(--bg);overflow:hidden}
.ctl input,.ctl select{flex:1;min-width:0;border:0;background:transparent;padding:4px 8px;font-family:var(--f-mono);font-size:14px;text-align:right}
.ctl select{text-align:left}
.ctl:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent)}
.unit{font-size:12px;color:var(--muted);padding:0 9px 0 2px;white-space:nowrap}
.sub-h{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.rows{display:grid;gap:4px}
.brow{display:grid;grid-template-columns:56px 64px 14px 1fr 30px;gap:6px;align-items:center}
.brow input,.brow select{border:1px solid var(--line2);border-radius:8px;background:var(--bg);padding:4px 7px;font-family:var(--f-mono);font-size:14px;min-width:0}
.rlab{font-size:12.5px;color:var(--muted)} .x{color:var(--muted);text-align:center}
.rows .linkbtn{justify-self:start;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted)}
.dz-out{display:grid;gap:18px;min-width:0}
.out-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.card,.sketch-card,.sum-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card-h{font-size:15px;font-weight:600;margin-bottom:10px}
.sec-svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.legend{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}

.legend i{display:inline-block;width:11px;height:11px;border-radius:50%}
.legend i.s-bt{background:var(--blue)} .legend i.s-bb{background:var(--acc)} .legend i.s-bs{background:var(--pink)}
.legend i.s-link-k{border-radius:3px;border:2px solid var(--teal)} .legend i.s-pile-k{border:2px solid var(--muted)}
.legend i.s-perim-k{border-radius:2px;border:1.5px dashed var(--pink)} .legend i.s-strut-k{height:3px;border-radius:2px;background:var(--acc)} .legend i.s-mesh-k{height:3px;border-radius:0;background:var(--blue)}
/* svg drawing tokens */
.s-conc{fill:var(--conc);stroke:var(--conc-line);stroke-width:1.5}
.s-link{fill:none;stroke:var(--teal)} .s-link2{fill:none;stroke:color-mix(in srgb,var(--teal) 70%,var(--ink))}
.hero-svg .s-link{stroke-width:4} .hero-svg .s-link2{stroke-width:2.5}
.s-bt{fill:var(--blue)} .s-bb{fill:var(--acc)} .s-bs{fill:var(--pink)}
.s-na{stroke:var(--pink);stroke-width:1.5;stroke-dasharray:6 4}
.s-dim{stroke:var(--muted);stroke-width:1}
.s-lbl{fill:var(--muted);font:500 11.5px var(--f-mono)}
.s-mesh{stroke:var(--blue);stroke-width:1;opacity:.45}
.s-perim{fill:none;stroke:var(--pink);stroke-width:1.5;stroke-dasharray:6 4} .s-perim.thin{stroke-width:1.2}
.s-strut{stroke:var(--acc);stroke-width:2.5;opacity:.8;stroke-linecap:round}
.s-pile{fill:var(--card);stroke:var(--muted);stroke-width:1.5} .s-pile.hot{stroke:var(--acc);stroke-width:2.5}
.s-pid{fill:var(--ink);font:600 10.5px var(--f-mono)} .s-pv{fill:var(--acc);font:600 10.5px var(--f-mono)}
.s-col{fill:color-mix(in srgb,var(--ink) 75%,transparent);stroke:var(--ink)}
.s-pilee{fill:var(--bg2);stroke:var(--muted)} .s-tie{stroke:var(--blue);stroke-width:3}
/* summary */
.sum{border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:baseline}
.sum.ok{background:var(--ok-bg)} .sum.bad{background:var(--bad-bg)}

.sum-v{font-family:var(--f-disp);font-size:30px;font-weight:700}
.sum.ok .sum-v{color:var(--ok)} .sum.bad .sum-v{color:var(--bad)}
.sum-u{font-size:15px} .sum-g{grid-column:1/-1;font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin:14px 0 0}
.kv div{border-top:1px solid var(--line);padding-top:6px;min-width:0}
.kv dt{font-size:12.5px;color:var(--muted)} .kv dd{margin:0;font-size:16px;font-weight:500}
.u{font-size:12px;color:var(--muted);font-family:var(--f-body)}
/* checks table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.chk th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);font-weight:600}

.num{text-align:right;white-space:nowrap}
.urb{display:grid;grid-template-columns:minmax(60px,1fr) 42px;gap:8px;align-items:center;min-width:120px}
.urb b{font-size:13px;text-align:right}
tr.ok .ur i{background:var(--ok)} tr.warn .ur i{background:var(--warn)} tr.bad .ur i{background:var(--bad)}
/* charts */
.charts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.chart{margin:0} .chart svg{width:100%;height:auto;display:block}
.chart figcaption,.figcap{font-size:13px;font-weight:600;margin-bottom:4px}
.c-grid{stroke:var(--line);stroke-width:1} .c-axis{stroke:var(--muted);stroke-width:1.2}
.c-tick{fill:var(--muted);font:10.5px var(--f-mono)} .c-ax{fill:var(--muted);font:500 11px var(--f-mono)}
.c-area{fill:color-mix(in srgb,var(--blue) 12%,transparent);stroke:none} .c-line{fill:none;stroke:var(--blue);stroke-width:2.2;stroke-linejoin:round}
.c-pt{fill:var(--acc);stroke:var(--card);stroke-width:2} .c-ptl{fill:var(--acc);font:700 11px var(--f-mono)} .c-vec{stroke:var(--acc);stroke-width:1.6;stroke-dasharray:4 3}
.elev{width:100%;min-width:420px;height:auto}

/* report (paper look, fixed in both themes) */
.rp-bar{margin-top:30px;display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;padding:16px 18px}
.rp-bar h2{font-size:20px}
.rp-meta{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.rp-meta label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.rp-meta input{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;background:var(--bg);min-width:0}
.rp-btns{display:flex;gap:8px}
.report{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-top:0;padding:34px 40px;font-size:13px;line-height:1.5;color-scheme:light}
.report .muted,.report .u{color:var(--paper-mute)}
.rp-head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;border-bottom:2px solid var(--paper-ink);padding-bottom:12px}
.rp-brand{display:flex;gap:10px;align-items:center} .rp-brand b{font-family:var(--f-disp);font-size:18px;display:block} .rp-brand small{color:var(--paper-mute);font-family:var(--f-mono);font-size:11px}
.rp-hd th,.rp-hd td{border:1px solid var(--paper-line);padding:4px 8px;font-size:12px;text-align:left}
.rp-hd th{background:var(--paper-tint);font-weight:600;width:16%;color:var(--paper-mute)}
.rp-verdict{margin:16px 0;padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;gap:10px;font-size:14px;border:1.5px solid}
.rp-verdict.ok{border-color:#119C55;color:#0C7A42;background:#EEF9F3} .rp-verdict.bad{border-color:#D8303F;color:#B3202E;background:#FDF0F1}
.rp-sec{margin-top:20px;break-inside:auto}
.rp-sec h3{font-size:15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--paper-line);padding-bottom:5px;margin-bottom:6px}
.rp-n{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:6px;background:var(--paper-ink);color:var(--paper);font-size:12px;font-family:var(--f-mono)}
.rp-cl{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--paper-mute);font-weight:400}
.rp-t td{padding:4px 6px;border-bottom:1px dotted var(--paper-line);vertical-align:top}
.rp-l{width:22%;color:var(--paper-mute)} .rp-ex{font-family:var(--f-mono);font-size:12.2px} .rp-note{width:12%;font-family:var(--f-mono);font-size:11px;color:var(--paper-mute);text-align:right}
.rp-t .num{width:18%}
.rp-txt{color:var(--paper-mute);font-style:italic;font-size:12.5px;padding:6px 0}
.rp-chk td{background:var(--paper-tint);font-weight:600}
.rp-chk.ok .rp-v{color:#0C7A42} .rp-chk.bad .rp-v{color:#B3202E}
.rp-2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.rp-in td{padding:3px 6px;border-bottom:1px dotted var(--paper-line);font-size:12px}
.rp-fig .legend{color:var(--paper-mute)}
.rp-sum th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:5px 6px;border-bottom:1.5px solid var(--paper-ink);color:var(--paper-mute)}
.rp-sum td{padding:5px 6px;border-bottom:1px solid var(--paper-line)}
.rp-foot{margin-top:22px;font-size:11px;color:var(--paper-mute);border-top:1px solid var(--paper-line);padding-top:8px}
.report .charts3{margin-top:14px}
.report{--conc:#E4EAF3;--conc-line:#8C9BB5;--muted:#5A6478;--ink:#141B2B;--line:#D5DBE5;--card:#FFFFFF;--bg2:#EDF2F9;--blue:#2E6BFF;--teal:#00A89A;--acc:#FF6A2B;--pink:#F2387A}
.pdf-mode .report{width:780px;border:0;padding:0 6px}

/* admin */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid}
.stat span{font-size:13px;color:var(--muted)} .stat b{font-family:var(--f-disp);font-size:28px;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--warn)}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:9px 16px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.tbl-tools{margin-bottom:10px} .tbl-tools input{width:100%;max-width:360px;padding:8px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--bg)}
.adm td.act{white-space:nowrap;text-align:right} .adm td.act .btn{margin-left:4px}
.empty{text-align:center;padding:36px 16px;display:grid;gap:8px;justify-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:17px;font-family:var(--f-disp)} .empty p{max-width:52ch}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(12,19,32,.5);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:640px;display:grid;gap:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.modal h2{font-size:22px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mgrid label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.mgrid input,.mgrid select{padding:8px 10px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);min-width:0}
.mgrid input:disabled{opacity:.6}
.mgrid .full,.quick,.chkl{grid-column:1/-1}
.quick{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pw{display:flex;gap:6px} .pw input{flex:1;font-family:var(--f-mono)}
.chkl{display:flex !important;align-items:center;gap:8px;color:var(--ink)}
.mfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .grow{flex:1}
.confirm{font-size:13.5px;color:var(--bad);display:flex;gap:6px;align-items:center}

/* language toggle, admin test bar, filters */
.lang{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.testbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--blue) 8%,var(--card));border:1px dashed color-mix(in srgb,var(--blue) 45%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:13.5px;color:var(--muted)}
.tbl-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pad{padding:18px 4px}

/* StructCap brand, landing hero, two-step picker */
.logo{flex:none;display:block}
.wordmark{font-family:var(--f-disp);font-weight:700;letter-spacing:-.01em}
.wordmark b{background:linear-gradient(90deg,var(--acc),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.mega{display:flex;align-items:center;gap:clamp(8px,1.2vw,14px);margin-bottom:6px}
.mega-logo{width:clamp(36px,4.5vw,56px);height:auto;filter:drop-shadow(0 12px 24px color-mix(in srgb,var(--pink) 35%,transparent))}
.mega-word{font-size:clamp(30px,4.75vw,62px);font-weight:700;letter-spacing:-.02em;line-height:1.25;padding-right:.12em;background:linear-gradient(95deg,var(--acc) 0%,var(--pink) 38%,#8B5CF6 64%,var(--blue) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.14em;overflow:visible}
.mega-word span{font-style:italic}
.tagline{font-family:var(--f-disp);font-size:clamp(20px,2.4vw,28px);font-weight:600;margin:6px 0 14px;letter-spacing:.01em}
.code-list{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:10px}
.code-list li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--glass);border:1px solid color-mix(in srgb,var(--line2) 60%,transparent);border-left:4px solid var(--tone);border-radius:12px;padding:10px 14px;backdrop-filter:blur(8px)}
.code-list b{font-family:var(--f-disp);font-size:16px} .code-list .mono{font-size:12.5px;color:var(--muted)}
.code-list p{font-size:13.5px;color:var(--muted);margin-top:2px}
.price b{font-size:30px;color:var(--ink);font-family:var(--f-disp)}
.flow{display:grid;gap:16px}
.step-h{display:flex;align-items:center;gap:12px;font-size:20px;flex-wrap:wrap}
.step-n{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--pink));color:#fff;font-size:16px}
.step-sub{font-family:var(--f-body);font-size:14px;font-weight:400}
.step2{display:grid;gap:16px;margin-top:14px;padding-top:22px;border-top:1px dashed var(--line2);scroll-margin-top:90px;animation:rise .35s ease both}

.step-wait{padding:6px 2px}
.code-row{display:flex;justify-content:space-between;align-items:center}
.code-pick.on{border:2px solid var(--tone);box-shadow:0 0 0 4px color-mix(in srgb,var(--tone) 16%,transparent),var(--shadow)}
.pick .pick-t .pill{vertical-align:middle;margin-left:6px}
.analysis-strip{margin-top:34px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:18px 22px;border:1px dashed var(--line2);border-radius:18px;background-image:repeating-linear-gradient(0deg,transparent 0 23px,var(--line) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,var(--line) 23px 24px);background-color:var(--card)}
.analysis-strip h2{font-size:20px}
@media (max-width:640px){.analysis-strip{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.step2{animation:none}}

/* Pro-for-free, code picker popup */
.promo-banner{position:relative;z-index:2;max-width:1200px;margin:18px auto 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;border-radius:14px;background:var(--glass);backdrop-filter:blur(10px);border:2px solid transparent;background-image:linear-gradient(var(--card),var(--card)),linear-gradient(90deg,var(--acc),var(--pink),var(--blue));background-origin:border-box;background-clip:padding-box,border-box;box-shadow:var(--shadow)}
.hero .promo-banner{margin-inline:20px}
@media (min-width:1260px){.hero .promo-banner{margin-inline:auto}}
.promo-banner b{font-family:var(--f-disp);font-size:17px} .promo-banner span:not(.pill){color:var(--muted);font-size:14px;flex:1;min-width:220px}
.price s{color:var(--muted);font-size:18px}
.promo-card{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:18px}
.promo-card.on{border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 7%,var(--card))}
.promo-card b{font-family:var(--f-disp);font-size:17px} .promo-card p{font-size:13.5px;color:var(--muted)}
.switch{flex:none;width:54px;height:30px;border-radius:99px;border:0;background:var(--line2);position:relative;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--acc)} .switch[aria-checked="true"] i{transform:translateX(24px)}
.code-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.code-big{font-family:var(--f-mono);font-weight:600;font-size:30px;line-height:1;letter-spacing:.04em;color:var(--tone);border:2px solid var(--tone);border-radius:10px;padding:6px 9px;flex:none}
.code-pick.on{background:color-mix(in srgb,var(--tone) 11%,var(--card))}
.code-pick::after{display:none}
.elem-pop{max-width:1000px;border-top:6px solid var(--tone);background:linear-gradient(180deg,color-mix(in srgb,var(--tone) 10%,var(--card)),var(--card) 140px);animation:popin .22s ease both}
@keyframes popin{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.pop-head{display:flex;align-items:center;gap:14px}
.pop-head h2{font-size:24px} .pop-x{margin-left:auto;align-self:flex-start}
.pop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.elem-pop .pick{--tone:inherit;box-shadow:none}
.elem-pop .pick::after{display:none}
.elem-pop .pick:hover{border-color:var(--tone)}
.elem-pop .pick-go{color:var(--tone)}
@media (max-width:820px){.pop-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.elem-pop{animation:none}}

.foot .copy{font-weight:600;color:var(--ink)}
.btn.struck{text-decoration:line-through;text-decoration-thickness:2px;opacity:.5;cursor:default;pointer-events:none}
.promo-note{font-family:var(--f-disp);font-weight:600;color:var(--acc)}
.s-tri{fill:none;stroke:var(--blue);stroke-width:3;opacity:.7}
.s-colp{fill:color-mix(in srgb,var(--ink) 12%,transparent);stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 3}
.s-stie{stroke:var(--blue);stroke-width:4;stroke-linecap:round;opacity:.85} .s-stop{stroke:#965cdc;stroke-width:1.6;opacity:.85} .s-strut.over,.s-stie.over,.s-stop.over{stroke:var(--bad,#d42a6b)}
.s-tnode{fill:var(--ink)} .s-tid{fill:var(--blue);font:600 10px var(--f-mono)}
.legend i.s-stie-k{height:4px;border-radius:2px;background:var(--blue)} .legend i.s-stop-k{height:2px;border-radius:1px;background:#965cdc}
.w-found{fill:color-mix(in srgb,var(--muted) 14%,transparent)} .w-soil{fill:url(#wsoil);stroke:none} .w-hatch{stroke:color-mix(in srgb,#9a7b4f 55%,transparent);stroke-width:1}
