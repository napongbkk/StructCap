.an-wtbl{max-height:min(58vh,520px);overflow:auto;border:1px solid var(--line);border-radius:8px;margin:4px 0 8px}
.an-wtbl table{width:100%;border-collapse:collapse;font-size:12.5px}
.an-wtbl th{position:sticky;top:0;background:var(--card);z-index:1;text-align:left;font-weight:700;padding:5px 6px;border-bottom:1px solid var(--line2);white-space:nowrap}
.an-wtbl td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.an-wtbl td.num{text-align:right}.an-wtbl tr.on td{background:color-mix(in srgb,var(--acc) 8%,transparent)}.an-wtbl tr.bad td{color:#dc2626}.an-wtbl tr.tot td{font-weight:700;border-top:1px solid var(--line2)}
.an-wtbl.edit input{width:78px;padding:2px 5px;font-size:12px;border:1px solid var(--line2);border-radius:5px;background:var(--card);color:var(--ink)}
.an-wtbl.edit select{max-width:130px;padding:2px 4px;font-size:12px;border:1px solid var(--line2);border-radius:5px;background:var(--card);color:var(--ink)}
.an-wsel{font-size:12px;color:var(--muted);margin:0 0 6px}
.an-stat{display:grid;gap:0}.an-stat>div{display:grid;grid-template-columns:minmax(120px,38%) minmax(0,1fr);gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12.5px}.an-stat dt{color:var(--muted)}.an-stat dd{margin:0}
@media (max-width:900px){.an-app{grid-template-rows:auto auto auto}.an-rb.big{height:58px}}

/* ribbon: compact buttons on narrower screens so every group stays visible */
@media (max-width:1280px){
  .an-rb.big{height:54px;min-width:44px;max-width:72px;font-size:10.8px;padding:3px 3px 2px;gap:2px}
  .an-ic.big{width:22px;height:22px}
  .an-rb.sm{font-size:11.5px;height:19px;padding:1px 5px 1px 3px}
  .an-rgi{padding:1px 3px 2px}
  .an-rgt{font-size:10px;padding:2px 5px 3px}
  .an-rtab{padding:5px 9px 6px;font-size:12px}
}
@media (max-width:760px){
  .an-rb.big{height:50px;min-width:42px;max-width:64px;font-size:10.3px}
  .an-ic.big{width:20px;height:20px}
  .an-rtab{padding:4px 7px 5px;font-size:11.5px}
  .an-qb{width:26px;height:24px}
}

/* ribbon buttons never scroll; small rows grow with the font instead of clipping */
.an-rib .an-rb{overflow:visible}
.an-rb.sm{height:auto;min-height:20px;line-height:1.25}
.an-rcol{overflow:visible}

/* cursor guide overlay + quick start */
.an-canvas{position:relative}
.an-canvas canvas#anCv{cursor:default}
.an-guide{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.an-quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;margin:6px 0;border:1px dashed var(--line2);border-radius:10px}
.an-quick>span{width:100%;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* results panel: drag handle on its top edge */
.an-drawer.on{position:relative}
.an-drawgrip{flex:none;height:9px;margin-top:-1px;cursor:ns-resize;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 4%,var(--card));border-bottom:1px solid var(--line);touch-action:none}
.an-drawgrip i{display:block;width:44px;height:3px;border-radius:2px;background:var(--line2)}
.an-drawgrip:hover,.an-drawgrip:focus-visible{background:color-mix(in srgb,var(--blue) 12%,var(--card));outline:none}
.an-drawgrip:hover i,.an-drawgrip:focus-visible i{background:var(--blue)}
body.an-resizing,body.an-resizing *{cursor:ns-resize!important;user-select:none!important}

/* design standard chip in the tree header + ribbon group highlight */
.an-stdchip{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);background:color-mix(in srgb,var(--acc) 10%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:999px;padding:2px 9px 2px 6px;cursor:pointer;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an-stdchip:hover{border-color:var(--acc)}.an-stdchip .an-ic{width:13px;height:13px}
.an-treehead .grow{flex:1}
@keyframes anflash{0%,100%{box-shadow:none}30%,70%{box-shadow:inset 0 0 0 2px var(--acc)}}
.an-rg.an-flash{animation:anflash 1.2s ease}
</style>
</head>

<script src="frame.js"></script>
<script src="bridge.js"></script>
<script src="building.js"></script>
